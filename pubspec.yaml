name: dsp_driver_app
description: "Chiringuito Driver Mobile App - Food & Courier Logistics Engine with Mapbox Live Navigation"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.2

  # Networking & Real-Time
  dio: ^5.7.0
  socket_io_client: ^3.0.2

  # Mapbox Vector & Raster Tile Navigation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Native Device Capabilities & Permissions
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2

  # Local Persistence & Utilities
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

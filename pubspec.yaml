name: dsp_driver_app
description: "OpenDSP Driver Mobile App - Food Drive & Courier Logistics Engine with Mapbox Live Navigation"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.2

  # Networking & Real-Time
  dio: ^5.7.0
  socket_io_client: ^3.0.2

  # Mapbox Vector & Raster Tile Navigation (NO Google Maps!)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Local Persistence & Utilities
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
